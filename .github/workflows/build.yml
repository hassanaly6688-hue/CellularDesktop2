name: Build CellularDesktop (Windows)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore CellularDesktop.csproj
      

      - name: Publish (single self-contained exe)
        run: >
          dotnet publish CellularDesktop.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -o publish_output

      - name: Upload exe as artifact
        uses: actions/upload-artifact@v4
        with:
          name: CellularDesktop-exe
          path: publish_output/CellularDesktop.exe
